<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Organism Face</title>
<style>
:root {
  --stage: #05070c; --ink: #cfe7ff; --muted: #7d8ea8; --line: rgba(140, 180, 230, .18);
  --glass: rgba(14, 20, 32, .72); --accent: #6cc4ff; --warn: #f2c14e; --bad: #ff7a7a; --violet: #b79cff;
}
@media (prefers-color-scheme: light) {
  :root:not([data-theme="dark"]) { --glass: rgba(14, 20, 32, .78); }
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--stage); color: var(--ink); overflow: hidden;
  font: 14px/1.4 system-ui, -apple-system, Segoe UI, sans-serif; }
#stage { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
.hud { position: fixed; z-index: 2; background: var(--glass); border: 1px solid var(--line); border-radius: 12px;
  backdrop-filter: blur(6px); padding: 8px 12px; }
#status { top: 12px; left: 12px; display: flex; gap: 12px; align-items: center; flex-wrap: wrap; max-width: calc(100vw - 24px); }
#status b { font-weight: 650; letter-spacing: .3px; }
.pill { font: 600 11px ui-monospace, Menlo, Consolas, monospace; padding: 2px 8px; border-radius: 99px; border: 1px solid var(--line); color: var(--muted); }
.meter { width: 70px; height: 5px; background: rgba(255,255,255,.08); border-radius: 3px; overflow: hidden; display: inline-block; vertical-align: middle; }
.meter i { display: block; height: 100%; background: var(--accent); transition: width .3s; }
#controls { top: 12px; right: 12px; display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; max-width: 62vw; }
#voices { max-width: 170px; }
button, select, input[type=text] { font: inherit; font-size: 13px; color: var(--ink); background: rgba(255,255,255,.05);
  border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px; }
button { cursor: pointer; } button:hover { border-color: var(--accent); } button.on { background: var(--accent); color: #031018; border-color: var(--accent); }
#captions { left: 50%; transform: translateX(-50%); bottom: 72px; width: min(760px, calc(100vw - 24px)); text-align: center;
  background: transparent; border: none; backdrop-filter: none; pointer-events: none; }
#say-line { font-size: clamp(16px, 2.2vw, 22px); min-height: 1.4em; text-shadow: 0 2px 12px #000; }
#say-line .done { color: var(--ink); } #say-line .now { color: #fff; text-shadow: 0 0 12px var(--accent); } #say-line .todo { color: var(--muted); }
#hear-line { color: var(--muted); font-size: 14px; min-height: 1.3em; margin-top: 6px; }
#thought-line { color: var(--violet); font-style: italic; font-size: 13px; min-height: 1.2em; margin-bottom: 6px; opacity: .85; }
#inputbar { left: 50%; transform: translateX(-50%); bottom: 12px; width: min(760px, calc(100vw - 24px)); display: flex; gap: 6px; }
#inputbar input { flex: 1; min-width: 0; }
#eyeview { right: 12px; bottom: 72px; padding: 6px; width: 220px; }
#eyeview .wrap { position: relative; width: 100%; aspect-ratio: 4 / 3; border-radius: 8px; overflow: hidden; background: #000; }
#eyeview video, #eyeview canvas { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; transform: scaleX(-1); }
#eyeview small { color: var(--muted); display: block; margin-top: 4px; font-size: 11px; }
#gate { position: fixed; inset: 0; z-index: 5; display: grid; place-items: center; background: rgba(3, 5, 9, .82); }
#gate .card { max-width: 440px; margin: 16px; padding: 22px; border-radius: 14px; background: #0c121d; border: 1px solid var(--line); }
#gate h1 { margin: 0 0 8px; font-size: 20px; } #gate p { color: var(--muted); margin: 0 0 14px; }
#gate label { display: block; margin: 6px 0; } #gate button { margin-top: 12px; width: 100%; padding: 10px; font-size: 15px; }
.hidden { display: none !important; }
a { color: var(--accent); }
@media (max-width: 640px) { #eyeview { width: 128px; bottom: 120px; } #controls { max-width: 100vw; top: 64px; left: 12px; right: 12px; justify-content: flex-start; }
  #captions { bottom: 64px; } }
</style>
</head>
<body>
<canvas id="stage"></canvas>

<div id="status" class="hud">
  <b id="name">CortexAI</b>
  <span id="mode" class="pill">…</span>
  <span title="arousal">arousal <span class="meter"><i id="arousal"></i></span></span>
  <span title="valence" id="valence" class="pill">valence –</span>
  <span id="state" class="pill">idle</span>
</div>

<div id="controls" class="hud">
  <button id="btnCam" title="Eyes: stream the webcam to the visual system">👁 Eyes</button>
  <button id="btnMic" title="Ears: continuous speech recognition">👂 Ears</button>
  <button id="btnVoice" title="Mouth: speak replies aloud">👄 Voice</button>
  <select id="voices" title="Voice"></select>
  <button id="btnThoughts" class="on" title="Show inner thoughts">💭</button>
  <button id="btnSleep">Sleep</button><button id="btnWake">Wake</button>
  <a href="/brain" target="_blank"><button>🧠 Brain</button></a>
  <a href="/" target="_blank"><button>Dashboard</button></a>
</div>

<div id="captions" class="hud">
  <div id="thought-line"></div>
  <div id="say-line"></div>
  <div id="hear-line"></div>
</div>

<div id="inputbar" class="hud">
  <input type="text" id="say" placeholder="Talk to it (or turn on Ears and just speak)…" autocomplete="off">
  <button id="btnSend">Send</button>
  <button id="btnPTT" class="hidden" title="Hold to talk (server speech recognition)">🎙 Hold</button>
</div>

<div id="eyeview" class="hud hidden">
  <div class="wrap"><video id="video" autoplay muted playsinline></video><canvas id="boxes"></canvas></div>
  <small id="seen">what it sees</small>
</div>

<div id="gate">
  <div class="card">
    <h1>Wake the face</h1>
    <p>The eyes stream your webcam into the organism's visual system (object detection, gaze). The ears feed its
      auditory channel, and the mouth voices what it decides to say. Everything stays on this computer.</p>
    <label><input type="checkbox" id="gCam" checked> Eyes (camera)</label>
    <label><input type="checkbox" id="gMic" checked> Ears (microphone + speech recognition)</label>
    <label><input type="checkbox" id="gVoice" checked> Voice (speak aloud)</label>
    <button id="btnStart">Start</button>
  </div>
</div>

<script>
"use strict";
const $ = id => document.getElementById(id);
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const lerp = (a, b, t) => a + (b - a) * t;
const now = () => performance.now() / 1000;

// ------------------------------------------------------------------ organism state (from the server)
const org = { mode: "AWAKE", arousal: 0.45, fatigue: 0, valence: 0, emo: {}, focus: "", connected: false };
const face = {                       // expressive parameters (smoothed every frame)
  open: 1, openL: 1, openR: 1, wide: 1, smile: 0, raise: 0, frown: 0, worry: 0,
  mouthOpen: 0, mouthWidth: 1, gaze: { x: 0, y: 0 }, gazeTarget: { x: 0, y: 0 },
  blink: 0, surprise: 0, thinking: 0, earLevel: 0, dreamJitter: 0,
};
let speaking = false, waitingReply = false, lastThoughtAt = -99, lastHeardAt = -99;

// ------------------------------------------------------------------ face geometry (face units: y down, chin ≈ +0.95)
const EYE_Y = -0.12, EYE_X = 0.30, MOUTH_Y = 0.44;
function headPoint(t, jaw) {
  let x = 0.72 * Math.sin(t), y = -0.95 * Math.cos(t);
  if (y > 0) x *= 1 - 0.2 * (y / 0.95) ** 2;             // narrower chin
  if (y > 0.35) y += jaw * 0.07 * ((y - 0.35) / 0.6);      // the jaw drops when the mouth opens
  return [x, y];
}
function lidBounds(dx, P, side) {
  const hw = 0.105, hh = 0.05 * (side < 0 ? P.openL : P.openR) * P.wide;
  const k = Math.max(0, 1 - (dx / hw) ** 2) ** 0.7;
  return [EYE_Y - hh * k - 0.004, EYE_Y + hh * 0.75 * k + 0.002];
}
function mouthY(x, P, upper, inner) {
  const mw = 0.2 * P.mouthWidth, u = clamp(Math.abs(x) / mw);
  const corner = -P.smile * 0.05 * u * u + P.frown * 0.015 * u * u;
  const bow = 1 - u * u;
  if (upper) return MOUTH_Y - (inner ? 0.004 : 0.016) - P.mouthOpen * 0.035 * bow + corner;
  return MOUTH_Y + (inner ? 0.004 : 0.018) + P.mouthOpen * (inner ? 0.12 : 0.15) * bow ** 0.8 + corner;
}

// Feature point generators: each returns [[x, y, alpha], ...] with a fixed length.
const FEATURES = {
  head: { n: 96, loop: true, w: 0.6, f: (i, n, P) => [...headPoint(2 * Math.PI * i / n, P.mouthOpen), 1] },
  earL: { n: 8, w: 0.5, ear: true, f: (i, n) => { const a = -0.9 + 1.8 * i / (n - 1); return [-0.745 - 0.045 * Math.cos(a), 0.14 * Math.sin(a) - 0.05, 1]; } },
  earR: { n: 8, w: 0.5, ear: true, f: (i, n) => { const a = -0.9 + 1.8 * i / (n - 1); return [0.745 + 0.045 * Math.cos(a), 0.14 * Math.sin(a) - 0.05, 1]; } },
  browL: { n: 11, w: 0.9, f: (i, n, P) => brow(-1, i / (n - 1), P) },
  browR: { n: 11, w: 0.9, f: (i, n, P) => brow(1, i / (n - 1), P) },
  lidUL: { n: 17, w: 1, f: (i, n, P) => lid(-1, i / (n - 1), P, 0) },
  lidLL: { n: 13, w: 0.7, f: (i, n, P) => lid(-1, i / (n - 1), P, 1) },
  lidUR: { n: 17, w: 1, f: (i, n, P) => lid(1, i / (n - 1), P, 0) },
  lidLR: { n: 13, w: 0.7, f: (i, n, P) => lid(1, i / (n - 1), P, 1) },
  irisL: { n: 20, loop: true, w: 1, iris: -1, f: (i, n, P) => ring(-1, i, n, 0.042, P) },
  irisR: { n: 20, loop: true, w: 1, iris: 1, f: (i, n, P) => ring(1, i, n, 0.042, P) },
  pupilL: { n: 9, loop: true, w: 1.2, iris: -1, f: (i, n, P) => ring(-1, i, n, pupilR(P), P) },
  pupilR: { n: 9, loop: true, w: 1.2, iris: 1, f: (i, n, P) => ring(1, i, n, pupilR(P), P) },
  nose: { n: 6, w: 0.5, f: (i, n) => [0.004 * Math.sin(i), -0.1 + 0.24 * i / (n - 1), 0.8] },
  nostril: { n: 7, w: 0.6, f: (i, n) => { const a = Math.PI * i / (n - 1); return [-0.055 * Math.cos(a), 0.17 + 0.03 * Math.sin(a), 1]; } },
  lipU: { n: 21, w: 1, mouth: true, f: (i, n, P) => { const x = -0.2 * P.mouthWidth + 0.4 * P.mouthWidth * i / (n - 1); return [x, mouthY(x, P, true, false), 1]; } },
  lipL: { n: 21, w: 1, mouth: true, f: (i, n, P) => { const x = -0.2 * P.mouthWidth + 0.4 * P.mouthWidth * i / (n - 1); return [x, mouthY(x, P, false, false), 1]; } },
  lipIU: { n: 13, w: 0.6, mouth: true, f: (i, n, P) => { const x = (-0.15 + 0.3 * i / (n - 1)) * P.mouthWidth; return [x, mouthY(x, P, true, true), clamp(P.mouthOpen * 5)]; } },
  lipIL: { n: 13, w: 0.6, mouth: true, f: (i, n, P) => { const x = (-0.15 + 0.3 * i / (n - 1)) * P.mouthWidth; return [x, mouthY(x, P, false, true), clamp(P.mouthOpen * 5)]; } },
};
function brow(side, u, P) {
  const cx = side * EYE_X, x = cx - side * 0.08 + side * u * 0.2;
  const y = -0.3 - P.raise * 0.055 - 0.022 * Math.sin(u * Math.PI) + P.frown * 0.045 * (1 - u) - P.worry * 0.05 * (1 - u) ** 2;
  return [x, y, 1];
}
function lid(side, u, P, lower) {
  const cx = side * EYE_X, dx = -0.105 + 0.21 * u, [up, lo] = lidBounds(dx, P, side);
  return [cx + dx, lower ? lo : up, 1];
}
function pupilR(P) { return 0.014 * (0.8 + 0.6 * org.arousal + 0.5 * (org.emo.fear || 0)); }
function ring(side, i, n, r, P) {
  const cx = side * EYE_X + P.gaze.x * 0.052, cy = EYE_Y + P.gaze.y * 0.022;
  const a = 2 * Math.PI * i / n, x = cx + r * Math.cos(a), y = cy + r * Math.sin(a);
  const [up, lo] = lidBounds(x - side * EYE_X, P, side);
  const vis = clamp(Math.min(y - up, lo - y) / 0.01);     // only what is between the lids is visible
  return [x, y, vis];
}

// ------------------------------------------------------------------ particles
const parts = [];         // {x, y, vx, vy, feat, idx, rest:[x,y], w}
const featIndex = {};     // feature name -> [start, n]
let skinStart = 0, pairs = [];
function build() {
  const P0 = { ...face, gaze: { x: 0, y: 0 } };
  for (const [name, F] of Object.entries(FEATURES)) {
    featIndex[name] = [parts.length, F.n];
    for (let i = 0; i < F.n; i++) {
      const [x, y] = F.f(i, F.n, P0);
      parts.push({ x, y, vx: 0, vy: 0, feat: name, idx: i, rest: [x, y], a: 1, glow: 0 });
    }
  }
  skinStart = parts.length;
  let seed = 7; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
  for (let gy = -0.9; gy <= 0.9; gy += 0.082) for (let gx = -0.7; gx <= 0.7; gx += 0.082) {
    const x = gx + (rnd() - 0.5) * 0.05, y = gy + (rnd() - 0.5) * 0.05;
    const hx = 0.72 * (y > 0 ? 1 - 0.2 * (y / 0.95) ** 2 : 1);
    if ((x / (hx - 0.03)) ** 2 + (y / 0.92) ** 2 > 1) continue;
    if (Math.abs(Math.abs(x) - EYE_X) < 0.14 && Math.abs(y - EYE_Y) < 0.075) continue;
    if (Math.abs(x) < 0.23 && Math.abs(y - MOUTH_Y) < 0.06) continue;
    parts.push({ x, y, vx: 0, vy: 0, feat: "skin", idx: parts.length, rest: [x, y], a: 1, glow: 0 });
  }
  // plexus connections from rest geometry (k nearest within reach)
  const seen = new Set();
  for (let i = 0; i < parts.length; i++) {
    const d = [];
    for (let j = 0; j < parts.length; j++) if (j !== i) {
      const dx = parts[i].rest[0] - parts[j].rest[0], dy = parts[i].rest[1] - parts[j].rest[1], dd = Math.hypot(dx, dy);
      if (dd < 0.12) d.push([dd, j]);
    }
    d.sort((a, b) => a[0] - b[0]);
    for (const [dd, j] of d.slice(0, parts[i].feat === "skin" ? 4 : 2)) {
      const key = i < j ? i + ":" + j : j + ":" + i;
      if (!seen.has(key) && parts[i].feat !== parts[j].feat || (parts[i].feat === "skin" && !seen.has(key))) {
        seen.add(key); pairs.push([i, j, dd]);
      }
    }
  }
}
build();

// skin follows the features through a few soft "muscle" handles
function skinTarget(p, P) {
  let [x, y] = p.rest;
  const g = (hx, hy, s) => Math.exp(-((x - hx) ** 2 + (y - hy) ** 2) / (2 * s * s));
  if (y > 0.3) y += P.mouthOpen * 0.075 * g(0, 0.75, 0.38) * clamp((y - 0.3) / 0.3);
  const mw = 0.2 * P.mouthWidth;
  for (const s of [-1, 1]) {
    const w = g(s * 0.2, MOUTH_Y, 0.16);
    y -= P.smile * 0.04 * w; x += s * (P.mouthWidth - 1) * 0.08 * w + s * Math.max(0, P.smile) * 0.012 * w;
    y -= (P.raise * 0.045 - P.frown * 0.02) * g(s * EYE_X, -0.36, 0.2);
  }
  return [x, y];
}

// ------------------------------------------------------------------ rendering
const cv = $("stage"), ctx = cv.getContext("2d");
let W = 0, H = 0, S = 1, CX = 0, CY = 0, DPR = 1;
function resize() {
  DPR = Math.min(2, window.devicePixelRatio || 1);
  W = innerWidth; H = innerHeight; cv.width = W * DPR; cv.height = H * DPR;
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  const top = Math.max($("status").getBoundingClientRect().bottom, $("controls").getBoundingClientRect().bottom) + 10;
  const bottom = H - 150;                                   // keep the chin above captions and input
  S = Math.max(60, Math.min(W * 0.6, H * 0.34, (bottom - top) / 1.95)); CX = W / 2; CY = top + 0.97 * S;
}
addEventListener("resize", resize); resize(); setTimeout(resize, 300);

function palette() {
  let hue = org.valence >= 0 ? lerp(190, 40, clamp(org.valence * 1.4)) : lerp(190, 225, clamp(-org.valence * 1.4));
  let sat = 85, light = 52 + org.arousal * 18;
  if ((org.emo.fear || 0) > 0.35) hue = lerp(hue, 355, clamp((org.emo.fear - 0.35) * 2));
  if (org.mode === "DREAMING") { hue = 275; light = 48; }
  if (org.mode === "ASLEEP") { hue = 215; sat = 45; light = 30; }
  if (org.mode === "DROWSY") light -= 12;
  return { hue, sat, light };
}
const pulses = [];    // travelling signals along the optic / speech lines
function screen(x, y, depth = 1) {
  const turnX = face.gaze.x * 0.035 * depth, turnY = face.gaze.y * 0.02 * depth;
  const breathe = 1 + 0.006 * Math.sin(now() * 2 * Math.PI / (org.mode === "AWAKE" ? 4 : 7));
  return [CX + (x + turnX) * S * breathe, CY + (y + turnY) * S * breathe];
}
const DEPTH = f => (f === "head" || f.startsWith("ear")) ? 0.4 : f === "skin" ? 0.7 : f === "nose" || f === "nostril" ? 1.4 : 1;

let lastT = now();
function frame() {
  const t = now(), dt = Math.min(0.05, t - lastT); lastT = t;
  updateFace(t, dt);
  const P = face;
  // targets + spring dynamics
  for (const [name, F] of Object.entries(FEATURES)) {
    const [s, n] = featIndex[name];
    for (let i = 0; i < n; i++) {
      const [tx, ty, a] = F.f(i, n, P), p = parts[s + i];
      p.tx = tx; p.ty = ty; p.a = a;
    }
  }
  for (let i = skinStart; i < parts.length; i++) { const [tx, ty] = skinTarget(parts[i], P); parts[i].tx = tx; parts[i].ty = ty; parts[i].a = 1; }
  const shimmer = 0.0015 + org.arousal * 0.002 + (org.mode === "DREAMING" ? 0.004 : 0);
  const stiff = parts[0] ? 0.28 : 0;
  for (const p of parts) {
    const k = FEATURES[p.feat]?.iris ? 0.55 : p.feat.startsWith("lip") ? 0.45 : stiff;
    p.vx = (p.vx + (p.tx - p.x) * k) * 0.55 + (Math.random() - 0.5) * shimmer;
    p.vy = (p.vy + (p.ty - p.y) * k) * 0.55 + (Math.random() - 0.5) * shimmer;
    p.x += p.vx; p.y += p.vy; p.glow *= 0.94;
  }
  // thought ripple: a wave travelling from the forehead
  for (const r of ripples) {
    r.r += dt * 0.9;
    for (const p of parts) { const d = Math.hypot(p.x - r.x, p.y - r.y); if (Math.abs(d - r.r) < 0.05) p.glow = Math.max(p.glow, r.s * (1 - r.r)); }
  }
  for (let i = ripples.length - 1; i >= 0; i--) if (ripples[i].r > 1.1) ripples.splice(i, 1);

  // draw
  const { hue, sat, light } = palette();
  ctx.clearRect(0, 0, W, H);
  const bg = ctx.createRadialGradient(CX, CY, S * 0.1, CX, CY, S * 1.6);
  bg.addColorStop(0, `hsla(${hue},60%,${light * 0.25}%,0.35)`); bg.addColorStop(1, "rgba(0,0,0,0)");
  ctx.fillStyle = bg; ctx.fillRect(0, 0, W, H);
  const pos = parts.map(p => screen(p.x, p.y, DEPTH(p.feat)));
  // plexus
  ctx.lineWidth = 0.7;
  for (const [i, j] of pairs) {
    const a = parts[i], b = parts[j];
    const vis = Math.min(a.a, b.a); if (vis < 0.2) continue;
    const g = Math.max(a.glow, b.glow);
    ctx.strokeStyle = `hsla(${hue},${sat}%,${light + g * 30}%,${(0.1 + g * 0.5) * vis})`;
    ctx.beginPath(); ctx.moveTo(...pos[i]); ctx.lineTo(...pos[j]); ctx.stroke();
  }
  // feature contours
  for (const [name, F] of Object.entries(FEATURES)) {
    const [s, n] = featIndex[name];
    const boost = F.mouth && speaking ? 0.35 : F.ear ? face.earLevel * 0.8 : 0;
    ctx.strokeStyle = `hsla(${hue},${sat}%,${light + 10 + boost * 30}%,${0.35 + 0.3 * F.w + boost})`;
    ctx.lineWidth = F.iris ? 1.2 : 1;
    ctx.beginPath(); let started = false;
    for (let i = 0; i <= n - (F.loop ? 0 : 1); i++) {
      const k = s + (i % n), p = parts[k];
      if (p.a < 0.3) { started = false; continue; }
      if (!started) { ctx.moveTo(...pos[k]); started = true; } else ctx.lineTo(...pos[k]);
    }
    ctx.stroke();
  }
  // dots
  for (let i = 0; i < parts.length; i++) {
    const p = parts[i], F = FEATURES[p.feat]; if (p.a < 0.05) continue;
    let r = p.feat === "skin" ? 1.1 : F.iris ? 1.7 : 1.5;
    let l = light + 8 + p.glow * 35;
    if (F?.ear) { r += face.earLevel * 2.5; l += face.earLevel * 30; }
    if (F?.mouth && speaking) { r += 0.6; l += 10; }
    ctx.fillStyle = `hsla(${F?.iris ? (hue + 25) % 360 : hue},${sat}%,${Math.min(95, l)}%,${p.a * (p.feat === "skin" ? 0.55 : 0.95)})`;
    ctx.beginPath(); ctx.arc(pos[i][0], pos[i][1], r, 0, 7); ctx.fill();
  }
  // pupils glow (eyes locked on a person)
  if (face.open > 0.3) for (const side of [-1, 1]) {
    const [px, py] = screen(side * EYE_X + face.gaze.x * 0.052, EYE_Y + face.gaze.y * 0.022);
    const g = ctx.createRadialGradient(px, py, 0, px, py, S * 0.05);

function flash(text) { $("hear-line").textContent = text; setTimeout(() => { if ($("hear-line").textContent === text) $("hear-line").textContent = ""; }, 5000); }
async function sendTyped() { const t = $("say").value.trim(); if (!t) return; $("say").value = ""; sendHeard(t); }
$("btnSend").onclick = sendTyped; $("say").onkeydown = e => { if (e.key === "Enter") sendTyped(); };
$("btnCam").onclick = () => camStream ? stopEyes() : startEyes();
$("btnMic").onclick = () => earsOn ? stopEars() : startEars();
$("btnVoice").onclick = () => { voiceOn = !voiceOn; $("btnVoice").classList.toggle("on", voiceOn); if (!voiceOn) speechSynthesis?.cancel(); };
$("btnThoughts").onclick = () => { showThoughts = !showThoughts; $("btnThoughts").classList.toggle("on", showThoughts); if (!showThoughts) $("thought-line").textContent = ""; };
const cmd = c => fetch("/api/command", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ command: c }) });
$("btnSleep").onclick = () => cmd("sleep"); $("btnWake").onclick = () => cmd("wake");
$("btnStart").onclick = async () => {
  $("gate").classList.add("hidden");
  audioCtx = audioCtx || new AudioContext();
  if ($("gVoice").checked) { voiceOn = true; $("btnVoice").classList.add("on"); try { speechSynthesis.speak(new SpeechSynthesisUtterance(" ")); } catch (e) {} }
  if ($("gCam").checked) await startEyes();
  if ($("gMic").checked) await startEars();
  $("say").focus();
};

connect();
requestAnimationFrame(frame);
</script>
</body>
</html>
